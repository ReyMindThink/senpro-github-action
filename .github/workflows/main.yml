deploy:
  needs: test-build
  runs-on: ubuntu-latest

  strategy:
    matrix:
      node-version: [20.x]

  steps:
    - name: Build app on VM
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT }}
        script: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/ssh-praktikan54
          echo "Cek folder project";
          [ ! -d "${HOME}/senpro/545518/modul02/senpro-github-action/" ] &&
            {
              echo "Repository belum di-clone. Cloning...";
              mkdir -p ~/senpro/545518/modul02;
              cd ~/senpro/545518/modul02;
              git clone https://github.com/ReyMindThink/senpro-github-action.git;
              cd ~/senpro/545518/modul02/senpro-github-action;
              echo "Install Package dan Build Project";
              npm install;
              npm run build;
            } ||
            {
              echo "Repository sudah ada. Building...";
              cd ~/senpro/545518/modul02/senpro-github-action;
              git restore .;
              git pull origin main;
              echo "Install Package dan Build Project";
              npm install;
              npm run build;
            }